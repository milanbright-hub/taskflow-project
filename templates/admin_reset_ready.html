<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password reset link · TaskFlow Control</title><link rel="stylesheet" href="{{ url_for('static', filename='taskflow.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body class="admin-auth-shell"><main class="admin-auth-card"><span class="admin-auth-icon">✓</span><p class="admin-eyebrow">ONE-TIME HANDOFF</p><h1>Reset link created</h1><p class="admin-auth-copy">This single-use link for {{ user_name }} expires in 30 minutes. It is not stored in the account database and will not be shown again after you leave this page.</p><div class="reset-link-callout reset-link-single"><code id="reset-url">{{ request.host_url.rstrip('/') }}{{ reset_url }}</code><button class="admin-button admin-button-subtle" type="button" data-copy="{{ request.host_url.rstrip('/') }}{{ reset_url }}">Copy link</button></div><a class="admin-back-link" href="{{ url_for('admin_users') }}">Return to users</a></main><script src="{{ url_for('static', filename='admin.js') }}" defer></script></body></html>
